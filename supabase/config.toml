# Supabase CLI project configuration
# Docs: https://supabase.com/docs/guides/cli/config
#
# Usage:
#   1. Run `supabase link --project-ref <your-project-ref>` once to link this repo to your cloud project.
#   2. Run `supabase db push` to apply all migrations in supabase/migrations/ in order.
#   3. Run `supabase db push --db-url <connection-string>` if you prefer not to link.
#
# The project_id below is used only for local development; it does NOT need to match your cloud ref.

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
# receipts table requires REPLICA IDENTITY FULL (applied by migration 1)

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.image_transformation]
enabled = true

[auth]
enabled = true
# The base URL of your website; used for generating magic link redirect URLs.
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["https://127.0.0.1:5173", "http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
max_frequency = "5s"

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = ""

[analytics]
enabled = false
port = 54327
backend = "postgres"

[functions]
verify_jwt = true
