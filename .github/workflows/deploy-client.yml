# Deploy Client — runs on every push to main.
# Builds the Vite production bundle, syncs to S3, invalidates CloudFront.
#
# Required GitHub Actions secrets (Settings → Secrets → Actions):
#   AWS_ACCESS_KEY_ID             — IAM user key with S3 + CloudFront permissions
#   AWS_SECRET_ACCESS_KEY         — IAM user secret
#   VITE_SUPABASE_URL             — Supabase project URL (used at build time)
#   VITE_SUPABASE_ANON_KEY        — Supabase anon key (used at build time)
#
# Required GitHub Actions variables (Settings → Variables → Actions):
#   AWS_REGION                    — e.g. ap-southeast-1
#   VITE_API_BASE_URL             — CloudFront domain, e.g. https://abc123.cloudfront.net
#   S3_BUCKET_NAME                — from `terraform output -raw s3_bucket_name`
#   CLOUDFRONT_DISTRIBUTION_ID    — from `terraform output -raw cloudfront_distribution_id`

name: Deploy Client

on:
  push:
    branches:
      - main
    paths:
      # Only run when client source or dependencies change
      - "client/**"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: deploy-client
  cancel-in-progress: false   # never cancel an in-flight deployment

env:
  AWS_REGION:                 ${{ vars.AWS_REGION }}
  S3_BUCKET_NAME:             ${{ vars.S3_BUCKET_NAME }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    name: Build → S3 → CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── CI gate ───────────────────────────────────────────────────────────

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck client
        working-directory: client
        run: npx tsc --noEmit

      # ── Vite production build ─────────────────────────────────────────────
      # Env vars prefixed VITE_ are embedded into the bundle at build time.
      # Sensitive values (anon key, Supabase URL) come from GitHub secrets.
      # Non-sensitive values (API base URL) come from GitHub variables.

      - name: Build client
        working-directory: client
        env:
          VITE_SUPABASE_URL:     ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL:     ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      # ── AWS credentials ───────────────────────────────────────────────────

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── Upload to S3 ──────────────────────────────────────────────────────
      # --delete removes files in S3 that no longer exist in dist/
      # Cache-Control headers:
      #   index.html    → no-cache (always re-validate; contains hashed asset references)
      #   *.js / *.css  → 1 year   (Vite appends content hashes to filenames)
      #   other assets  → 1 week

      - name: Sync index.html to S3 (no-cache)
        run: |
          aws s3 cp client/dist/index.html \
            s3://${{ env.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Sync hashed JS/CSS assets to S3 (immutable cache)
        run: |
          aws s3 sync client/dist/ s3://${{ env.S3_BUCKET_NAME }}/ \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Sync remaining assets to S3 (1-week cache)
        run: |
          aws s3 sync client/dist/ s3://${{ env.S3_BUCKET_NAME }}/ \
            --exclude "*.js" \
            --exclude "*.css" \
            --exclude "*.html" \
            --cache-control "public, max-age=604800" \
            --delete

      # ── Invalidate CloudFront cache ───────────────────────────────────────
      # Invalidate /* so all edge nodes serve the new index.html immediately.
      # JS/CSS files don't need invalidation because their names are hashed.

      - name: Invalidate CloudFront cache
        id: invalidation
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"
          echo "CloudFront invalidation started: $INVALIDATION_ID"

      - name: Wait for CloudFront invalidation to complete
        run: |
          echo "Waiting for invalidation ${{ steps.invalidation.outputs.id }} to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "${{ steps.invalidation.outputs.id }}"
          echo "✅ CloudFront cache invalidated."

      # ── Deployment summary ────────────────────────────────────────────────

      - name: Print deployment summary
        if: always()
        run: |
          echo "### Client Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| S3 bucket | \`${{ env.S3_BUCKET_NAME }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CloudFront ID | \`${{ env.CLOUDFRONT_DISTRIBUTION_ID }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Invalidation ID | \`${{ steps.invalidation.outputs.id }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
